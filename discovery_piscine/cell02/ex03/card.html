<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User profile card</title>
	<link rel="stylesheet" href="card.css">
</head>
<body>
	<div class="card-wrapper">
		<header>
			<h1>User Profile Card</h1>
		</header>

		<div class="card">
			<table class="info-table">
				<tr>
					<td class="photo-cell">
						<img src="me.jpg" alt="Profile picture" class="profile-pic">
					</td>
				</tr>
				<tr>
					<td class="login-cell">vglincha</td>
				</tr>
				<tr>
					<td class="desc-cell">Electronics Engineering</td>
				</tr>
				<tr>
					<td class="school-cell">KMITL</td>
				</tr>
				<tr>
					<td class="social-cell">
                        <a href="https://github.com/veda307" target="_blank" title="GitHub">
                         <img src="icons/github.png" alt="GitHub" class="social-icon">
                        </a>
                        <a href="https://www.instagram.com/vedadev_o4/" target="_blank" title="Instagram">
                         <img src="icons/instagram.png" alt="Instagram" class="social-icon">
                        </a>
                        <a href="https://discord.gg/u9XXupU2" target="_blank" title="Discord">
                        <img src="icons/discord.png" alt="Discord" class="social-icon">
                        </a>
                        <a href="https://line.me/ti/p/uMR2whIYZn" target="_blank" title="LINE">
                        <img src="icons/line.png" alt="LINE" class="social-icon">
                        </a>
                    </td>
				</tr>
			</table>
			<a href="#" class="contact-btn">Contact</a>
		</div>
	</div>
</body>
</html>
