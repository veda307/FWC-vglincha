<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Responsive</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}
		table {
			border-collapse: collapse;
			width: 100%;
			height: 100vh;
			table-layout: fixed;
		}
		th, td {
			border: 1px solid #FFFFFF;
			text-align: center;
			font-weight: bold;
			font-size: 3vw;
		}
		td:first-child {
			background-color: #FFB7C5;
		}
		td:last-child {
			background-color: #B7FFCD;
		}
	</style>
</head>
<body>
	<table>
		<tbody>
			<tr>
				<td>First Cell</td>
				<td>Second Cell</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
